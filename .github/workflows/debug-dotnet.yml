name: debug-dotnet
on: workflow_dispatch

jobs:
  debug:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os: [22.04, 24.04]
    container:
      image: docker://ghcr.io/ekristen/cast-tools/saltstack-tester:${{ matrix.os }}-3007
    steps:
      - uses: actions/checkout@v4
      - name: apply mulder state
        continue-on-error: true
        run: |
          salt-call --local -l info --file-root . --retcode-passthrough --state-output=mixed state.sls sift.python3-packages.mulder pillar="{sift_user: root}"
      - name: dump apt state
        if: always()
        run: |
          set -x
          echo "== /etc/apt/sources.list"; cat -A /etc/apt/sources.list || true
          ls -l /etc/apt/sources.list* /etc/apt/sources.list.d/ /etc/apt/trusted.gpg.d/ /etc/apt/keyrings/ || true
          for f in /etc/apt/sources.list.d/*; do echo "== $f"; cat "$f"; done
          apt-get update 2>&1 | grep -iE "dotnet|NO_PUBKEY|W:|E:" || true
          apt-cache policy dotnet-sdk-9.0 || true
          add-apt-repository -y ppa:dotnet/backports 2>&1 | tail -30 || true
          for f in /etc/apt/sources.list.d/*; do echo "== $f"; cat "$f"; done
          apt-cache policy dotnet-sdk-9.0 || true
