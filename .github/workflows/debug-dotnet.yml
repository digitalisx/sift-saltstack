name: debug-dotnet
on: workflow_dispatch

jobs:
  debug:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os: [22.04, 24.04]
        user: [root, sansforensics]
    container:
      image: docker://ghcr.io/ekristen/cast-tools/saltstack-tester:${{ matrix.os }}-3007
    steps:
      - uses: actions/checkout@v4
      - name: apply mulder state
        run: |
          salt-call --local -l info --file-root . --retcode-passthrough --state-output=mixed state.sls sift.python3-packages.mulder pillar="{sift_user: ${{ matrix.user }}}"
